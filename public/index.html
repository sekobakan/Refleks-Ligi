<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#120f3a"><title>Reflex League</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--s0:#2a1a7a;--s1:#5b2cff;--s2:#ff3d81;--s3:#00b8ff;--bg:#120f3a;--card:rgba(255,255,255,.075);--line:rgba(255,255,255,.14);--ink:#fff;--mut:#b3b0ea;--y:#ffd23f;--p:#ff4d8d;--g:#2ee6a6;--b:#38c6ff;--v:#8f6bff;--o:#ff9a3d;--acc:var(--y)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 17px/1.35 "Fredoka",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}svg.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.sky{position:fixed;inset:0;overflow:hidden;z-index:0;background:radial-gradient(120% 80% at 50% 0,var(--s0) 0,#120f3a 60%,#0b0926 100%)}
.sky i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.sky i:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:var(--s1)}.sky i:nth-child(2){width:55vmax;height:55vmax;right:-22vmax;top:20vh;background:var(--s2);animation-duration:23s;opacity:.33}.sky i:nth-child(3){width:60vmax;height:60vmax;left:-10vmax;bottom:-35vmax;background:var(--s3);animation-duration:27s;opacity:.3}
.sky:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.1) 1px,transparent 1.6px);background-size:24px 24px;-webkit-mask-image:linear-gradient(#000,transparent 75%);mask-image:linear-gradient(#000,transparent 75%)}
.sky b{position:absolute;display:block;opacity:.07;animation:floaty 14s ease-in-out infinite alternate}.sky b.r{border:3px solid #fff;border-radius:50%}.sky b.d{background:#fff;border-radius:50%}.sky b.s{background:#fff;border-radius:6px;transform:rotate(20deg)}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.15)}}@keyframes floaty{to{transform:translate(18px,-34px) rotate(40deg)}}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
#fx{position:fixed;inset:0;z-index:5;pointer-events:none;width:100%;height:100%}
.app{position:relative;z-index:1;max-width:480px;height:100%;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
.scr{display:none;flex:1;flex-direction:column;min-height:0}.scr.on{display:flex;animation:in .38s cubic-bezier(.2,.9,.3,1.15)}@keyframes in{from{opacity:0;transform:translateY(16px) scale(.98)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ico{width:46px;height:46px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:22px;display:grid;place-items:center;flex:none;backdrop-filter:blur(10px)}.ico:active,.chip:active{transform:scale(.94)}
.chip{height:46px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:16px;font-weight:600;padding:0 14px 0 6px;max-width:52%;display:flex;align-items:center;gap:9px;backdrop-filter:blur(10px)}.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip svg{color:var(--mut);font-size:15px}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.35)}
.logo{display:flex;flex-direction:column;align-items:center;margin-bottom:3vh;gap:4px;position:relative}
.halo{position:relative;width:120px;height:120px;display:grid;place-items:center}
.rays{position:absolute;left:50%;top:50%;width:440px;height:440px;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(255,255,255,.11) 0 9deg,transparent 9deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 8%,transparent 66%);mask-image:radial-gradient(circle,#000 8%,transparent 66%);animation:spin 40s linear infinite;z-index:-1;pointer-events:none}
.halo:before{content:"";position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,63,.5),transparent 68%);filter:blur(6px);animation:glow 2.4s ease-in-out infinite}@keyframes glow{50%{transform:scale(1.18);opacity:.7}}
.bolt{width:100px;height:100px;position:relative;filter:drop-shadow(0 10px 22px rgba(255,170,40,.55));animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
h1{font-size:54px;line-height:.9;margin:0;font-weight:700;letter-spacing:.005em;text-align:center;text-shadow:0 4px 0 rgba(0,0,0,.22),0 12px 30px rgba(0,0,0,.3)}
h1 b{display:block;background:linear-gradient(90deg,#fff27a,var(--y) 25%,var(--o) 60%,var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.22))}
.sub{color:var(--mut);text-align:center;margin:10px 0 0;font-size:16px;max-width:300px;text-wrap:balance}
.card{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05));border:1px solid var(--line);border-radius:22px;padding:13px 15px;backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 30px -12px rgba(0,0,0,.5)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.num{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;display:flex;align-items:center;gap:6px}.num svg{font-size:23px}
.lbl{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.09em}
.daily{display:flex;align-items:center;gap:14px}.daily .d{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--v),var(--b));display:grid;place-items:center;font-size:21px;font-weight:700;flex:none;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -4px 0 rgba(0,0,0,.18),0 8px 18px -6px var(--b)}
.daily .tx{flex:1;min-width:0;font-size:15px;text-wrap:balance}.cd{text-align:right;flex:none}.cd .num{font-size:18px;justify-content:flex-end}
.btn{appearance:none;border:0;border-radius:99px;padding:19px 22px;font-weight:700;font-size:23px;line-height:1;color:#3a2400;background:linear-gradient(180deg,#fff27a,#ffd23f 55%,#ffbd2e);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 7px 0 #c48a00,0 18px 34px -6px rgba(255,200,40,.5);width:100%;letter-spacing:.03em;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(5px);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 2px 0 #c48a00}
.btn.shine:after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-18deg);animation:shine 2.8s ease-in-out infinite}@keyframes shine{0%,55%{left:-45%}100%{left:120%}}
.btn.g{background:linear-gradient(180deg,#8dffdc,var(--g));box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 6px 0 #12a877,0 16px 30px -8px rgba(46,230,166,.5);color:#003324;font-size:18px;padding:16px}
.btn.s{background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.06));color:var(--ink);box-shadow:inset 0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.16);font-size:16px;padding:15px 10px;font-weight:600;gap:7px;letter-spacing:0}.btn.s:active{transform:scale(.96)}
.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.03)}}
/* oyun */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.hud .num{font-size:34px;min-width:84px}.hud .num.bump{animation:bump .25s}@keyframes bump{40%{transform:scale(1.25);color:var(--y)}}
.clock{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}.clock svg{color:var(--mut);font-size:19px}
.clock.low{background:linear-gradient(135deg,#ff3d5a,var(--o));border-color:transparent;animation:pulse .5s infinite}.clock.low svg{color:#fff}
.combo{min-width:84px;display:flex;flex-direction:column;align-items:flex-end;gap:5px}.combo b{font-size:22px;line-height:1;padding:6px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.combo.hot b{background:linear-gradient(135deg,var(--o),var(--p));border-color:transparent;box-shadow:0 6px 18px -4px var(--p);animation:pulse .6s infinite}
.pips{display:flex;gap:4px}.pips i{width:16px;height:5px;border-radius:9px;background:rgba(255,255,255,.18)}.pips i.on{background:var(--y);box-shadow:0 0 8px var(--y)}
.bar{height:12px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),#b6ff6a,var(--y));border-radius:99px;transform-origin:left;box-shadow:0 0 14px var(--g)}
.bar.low i{background:linear-gradient(90deg,#ff3d5a,var(--o));box-shadow:0 0 14px #ff3d5a}
.stage{flex:1;background:radial-gradient(130% 55% at 50% 0,color-mix(in srgb,var(--acc) 26%,transparent),transparent 62%),linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:22px;position:relative;touch-action:none;min-height:0;overflow:hidden;backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 26px 60px -30px var(--acc);transition:box-shadow .3s}
.stage:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--acc);box-shadow:0 0 18px var(--acc)}
.stage>*{animation:chin .28s cubic-bezier(.2,.9,.3,1.3) both}.stage>:nth-child(2){animation-delay:.04s}.stage>:nth-child(3){animation-delay:.08s}@keyframes chin{from{opacity:0;transform:translateY(14px) scale(.94)}}
.stage.bad{animation:shake .32s}.stage.ok{animation:pop .22s}@keyframes shake{20%{transform:translateX(-12px) rotate(-1deg)}60%{transform:translateX(12px) rotate(1deg)}}@keyframes pop{50%{transform:scale(1.025)}}
.stage.bad:after{content:"";position:absolute;inset:0;background:rgba(255,61,90,.22);animation:flash .32s forwards;pointer-events:none}@keyframes flash{to{opacity:0}}
.q{font-size:15px;font-weight:700;color:#141034;background:var(--acc);padding:8px 16px;border-radius:99px;text-transform:uppercase;letter-spacing:.08em;text-align:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 6px 16px -6px var(--acc)}
.big{font-size:66px;font-weight:700;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.25),0 10px 26px rgba(0,0,0,.35);text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.opt{border:0;border-radius:22px;padding:22px 0;min-height:92px;font-weight:700;font-size:31px;line-height:1;color:#1b1650;background:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),inset 0 3px 0 rgba(255,255,255,.6),0 8px 18px -8px rgba(0,0,0,.6);position:relative}
.opt:active{transform:translateY(3px) scale(.98)}.opt.yes{outline:4px solid var(--g);outline-offset:2px}.opt.no{outline:4px solid #ff3d5a;outline-offset:2px}
.track{width:100%;height:58px;background:repeating-linear-gradient(90deg,transparent 0 9.6%,rgba(255,255,255,.1) 9.6% 10%),rgba(0,0,0,.4);border-radius:99px;position:relative;overflow:hidden;border:1px solid var(--line);box-shadow:inset 0 4px 10px rgba(0,0,0,.4)}
.zone{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.22) 0 6px,transparent 6px 12px),linear-gradient(180deg,#8dffdc,var(--g));box-shadow:0 0 26px var(--g)}
.mk{position:absolute;top:0;bottom:0;width:10px;margin-left:-5px;background:#fff;border-radius:5px;box-shadow:0 0 16px 3px #fff}
.hint{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;width:min(100%,324px)}
.cell{aspect-ratio:1;border-radius:20px;background:rgba(0,0,0,.36);border:1px solid var(--line);transition:transform .08s;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.12)}.cell:active{transform:scale(.93)}
.cell.lit{background:var(--b);box-shadow:0 0 30px var(--b),inset 0 3px 0 rgba(255,255,255,.5);transform:scale(1.07)}.cell.hit{background:var(--g);box-shadow:0 0 22px var(--g)}
.arrow{width:156px;height:156px;border-radius:46px;display:grid;place-items:center;background:linear-gradient(135deg,var(--b),var(--v));box-shadow:inset 0 4px 0 rgba(255,255,255,.4),inset 0 -8px 0 rgba(0,0,0,.18),0 18px 40px -10px var(--b)}
.arrow.rev{background:linear-gradient(135deg,var(--p),var(--o));box-shadow:inset 0 4px 0 rgba(255,255,255,.4),inset 0 -8px 0 rgba(0,0,0,.18),0 18px 40px -10px var(--p)}
.arrow svg{width:92px;height:92px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}.stage>.arrow{animation:chin .28s cubic-bezier(.2,.9,.3,1.3) both,nudge .7s .3s ease-in-out infinite}@keyframes nudge{50%{translate:var(--dx,0) var(--dy,0)}}
.stage>.count{position:absolute;inset:0;display:grid;place-items:center;font-size:150px;font-weight:700;animation:none;text-shadow:0 8px 0 rgba(0,0,0,.25),0 0 60px var(--y)}.count span{animation:cd .55s ease-out both}@keyframes cd{from{transform:scale(2.2);opacity:0}60%{opacity:1}to{transform:scale(1)}}
.stage>.float{position:absolute;left:50%;top:36%;font-size:44px;font-weight:700;color:var(--y);pointer-events:none;animation:fl .7s ease-out forwards;text-shadow:0 3px 0 rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.4)}@keyframes fl{from{transform:translate(-50%,0) scale(.6);opacity:0}30%{opacity:1}to{transform:translate(-50%,-90px) scale(1.15);opacity:0}}
.note{font-size:14px;color:var(--mut);text-align:center}.sp{flex:1}.stack{display:flex;flex-direction:column;gap:12px}
/* yeni oyunlar */
.field{position:relative;width:100%;height:150px;border-radius:22px;background:rgba(0,0,0,.28);border:1px solid var(--line);box-shadow:inset 0 4px 12px rgba(0,0,0,.3)}.field.tall{height:auto;flex:1;max-height:330px;align-self:stretch}
.field i{position:absolute;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),inset 0 3px 0 rgba(255,255,255,.45)}
.target{position:absolute;width:104px;height:104px;margin:-52px;border:0;padding:0;border-radius:50%;background:radial-gradient(circle,#fff 0 15%,var(--p) 16% 38%,#fff 39% 60%,var(--p) 61%);box-shadow:0 0 34px var(--p),inset 0 -6px 0 rgba(0,0,0,.15);animation:shrink linear forwards}@keyframes shrink{to{transform:scale(.3)}}
.big.sm{font-size:42px;white-space:nowrap}.tq{font-size:25px;font-weight:600;text-align:center;line-height:1.2;text-wrap:balance;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.opts.txt .opt{font-size:19px;padding:10px 8px;min-height:80px;line-height:1.12}
.opt.yn svg{width:46px;height:46px;vertical-align:middle}.opt.yn.y{background:linear-gradient(180deg,#8dffdc,var(--g))}.opt.yn.n{background:linear-gradient(180deg,#ff9aac,#ff3d5a)}
.opt.done{opacity:.3;transform:scale(.93)}
.clock.prac{background:#fff;color:#1b1650;font-size:15px;cursor:pointer}.clock.prac svg{display:none}
.chal{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--p),var(--o));color:#fff;font-weight:600;padding:9px 16px;border-radius:99px;box-shadow:0 10px 24px -8px var(--p);font-size:15px}
.vs{align-self:center;font-weight:600;font-size:15px;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--line)}.vs:empty{display:none}.vs.w{background:rgba(46,230,166,.18);border-color:var(--g);color:var(--g)}
.tr{display:flex;gap:8px}.dot{position:relative}.dot:before{content:"";position:absolute;right:10px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--p);box-shadow:0 0 10px var(--p)}
.scope{display:flex;justify-content:center;gap:8px;margin-top:10px}.scope button{border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:600;font-size:14px;padding:7px 14px;border-radius:99px}.scope button.on{background:rgba(255,210,63,.18);border-color:var(--y);color:#fff}
.fl{font-size:15px;margin-left:6px}
.sheet .body{display:flex;flex-direction:column;gap:10px;text-align:center}.sheet .body p{margin:0;color:var(--mut)}
.qa{border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font-weight:600;font-size:17px;padding:14px;border-radius:16px;width:100%}.qa.yes{background:var(--g);color:#003324;border-color:transparent}.qa.no{background:#ff3d5a;border-color:transparent}
.shop{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.sw{border:2px solid var(--line);border-radius:18px;padding:6px 6px 8px;background:rgba(0,0,0,.25);color:#fff;font-weight:600;font-size:13px;display:flex;flex-direction:column;gap:6px;align-items:center}.sw.on{border-color:var(--y);box-shadow:0 0 18px -4px var(--y)}
.sw u{display:block;width:100%;height:54px;border-radius:12px;text-decoration:none}.sw small{display:flex;align-items:center;gap:4px;color:var(--mut);font-size:13px}.sw small svg{font-size:14px}
/* bitiş */
.emb{position:relative;height:104px;display:grid;place-items:center}.emb .gem{animation:drop .6s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 12px 22px rgba(0,0,0,.4))}@keyframes drop{from{transform:scale(0) rotate(-30deg)}}
.tier{align-self:center;display:flex;align-items:center;gap:7px;padding:6px 16px 6px 8px;border-radius:99px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:#1b1650;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 8px 18px -8px rgba(0,0,0,.6)}
.stars{display:flex;justify-content:center;gap:10px}.stars i{width:44px;height:44px;opacity:.18;filter:grayscale(1)}.stars i:nth-child(2){transform:translateY(-8px) scale(1.18)}.stars svg{width:100%;height:100%}
.stars i.on{opacity:1;filter:drop-shadow(0 0 12px rgba(255,210,63,.8));animation:star .5s cubic-bezier(.2,1.6,.4,1) both}@keyframes star{from{scale:0;rotate:-40deg}}
.escore{font-size:96px;font-weight:700;line-height:1;background:linear-gradient(180deg,#fff 30%,#bdb6ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(0,0,0,.22));text-align:center}
.rank{align-self:center;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:99px;background:rgba(255,210,63,.14);border:1px solid rgba(255,210,63,.5);color:var(--y);font-weight:600;font-size:15px}.rank:empty{display:none}
#end .card{text-align:left}#lb2{flex:0 0 58px;font-size:20px}#home .btn.s{padding:15px 6px}#end .btn.s span{white-space:nowrap}
/* sıralama */
.tabs{display:flex;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:99px;padding:4px}.tabs button{border:0;background:transparent;color:var(--mut);font-weight:600;font-size:15px;padding:10px 18px;border-radius:99px;transition:all .2s}.tabs button.on{background:#fff;color:#1b1650;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.me{display:flex;align-items:center;gap:12px;margin:12px 0 0;border-color:rgba(255,210,63,.55);background:linear-gradient(90deg,rgba(255,210,63,.2),rgba(255,154,61,.08))}.me .tx{flex:1;min-width:0}.me .tier{align-self:auto;flex:none}.me .num{font-size:24px}
.wk{font-size:13px;color:var(--mut);text-align:center;margin:8px 0 2px;min-height:18px}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:6px 0 10px}.pod>div{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;animation:chin .4s both}.pod>div:nth-child(2){animation-delay:.08s}.pod>div:nth-child(3){animation-delay:.16s}
